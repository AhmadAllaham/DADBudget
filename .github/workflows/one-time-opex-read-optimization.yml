name: One-time OPEX read optimization

on:
  push:
    paths:
      - '.github/workflows/one-time-opex-read-optimization.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Optimize OPEX Firestore reads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('js/opex-sync-v2.js')
          s = p.read_text(encoding='utf-8')
          original = s

          s = s.replace(
            "import { getFirestore, doc, getDoc, getDocs, collection, setDoc, serverTimestamp, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';",
            "import { getFirestore, doc, getDoc, getDocs, collection, setDoc, serverTimestamp, onSnapshot, query, where, Timestamp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';"
          )

          s = s.replace(
            "let baselineUnsub=null,baselineWatchReady=false,lastBaselineVersion='',adminSubmissionUnsub=null,adminSubmissionWatchReady=false,adminSubmissionTimer=null;",
            "let baselineUnsub=null,baselineWatchReady=false,lastBaselineVersion='',adminSubmissionUnsub=null,adminSubmissionWatchReady=false,adminSubmissionTimer=null,adminWatchSinceMs=0;"
          )

          s = s.replace(
            "submittedAt:serverTimestamp(),clientSubmittedAt:new Date().toISOString()",
            "submittedAt:serverTimestamp(),workflowUpdatedAt:serverTimestamp(),clientSubmittedAt:new Date().toISOString()"
          )

          new_loader = r'''async function loadAdminViewChunked(profile){
  const watchFrom=Date.now();adminWatchSinceMs=watchFrom;
  const meta=await getDoc(doc(db,'opex_baseline_meta','current'));
  if(!meta.exists())throw new Error('Finance OPEX baseline is not published yet');
  lastBaselineVersion=baselineVersion(meta.data()||{});
  const cached=localModel(),canUseCache=!!(cached?.cloudAdminView&&cached.baselineVersion===lastBaselineVersion&&Number(cached.adminCacheCheckedAt||0)>0&&cached.adminVisibleSubmissionFlags&&typeof cached.adminVisibleSubmissionFlags==='object');
  const deps={},visibleFlags={...(canUseCache?cached.adminVisibleSubmissionFlags:{})};
  let submissionCount=0;

  if(canUseCache){
    Object.entries(cached.departments||{}).forEach(([cc,d])=>deps[cc]=d);
    const since=Timestamp.fromMillis(Math.max(0,Number(cached.adminCacheCheckedAt||0)-5000));
    const changedSnap=await getDocs(query(collection(db,'opex_budget_submissions'),where('workflowUpdatedAt','>=',since)));
    for(let start=0;start<changedSnap.docs.length;start+=8){
      const chunk=changedSnap.docs.slice(start,start+8),updates=await Promise.all(chunk.map(async sub=>{
        const cc=clean(sub.id);if(!cc)return null;
        const baselineSnap=await getDoc(doc(db,'opex_baseline_departments',cc));if(!baselineSnap.exists())return null;
        const baseline=await decode(baselineSnap.data(),cc),submitted=await adminVisibleSubmission(sub.data()||{},cc),visible=!!submitted?.items;
        return{cc,department:visible?mergeSubmissionIntoBaseline(baseline,submitted):baseline,visible};
      }));
      updates.filter(Boolean).forEach(x=>{deps[x.cc]=x.department;visibleFlags[x.cc]=x.visible});
      await new Promise(resolve=>setTimeout(resolve,0));
    }
    submissionCount=Object.values(visibleFlags).filter(Boolean).length;
    setStatus(`Finance OPEX cache verified · ${changedSnap.size} changed submission${changedSnap.size===1?'':'s'} refreshed`);
  }else{
    const [baselineSnap,submissionSnap]=await Promise.all([getDocs(collection(db,'opex_baseline_departments')),getDocs(collection(db,'opex_budget_submissions'))]);
    const submissions={};submissionSnap.forEach(x=>submissions[clean(x.id)]=x.data()||{});
    const docs=baselineSnap.docs;
    for(let start=0;start<docs.length;start+=8){
      const chunk=docs.slice(start,start+8),loaded=await Promise.all(chunk.map(async snap=>{
        const cc=clean(snap.id);if(!cc)return null;
        const baseline=await decode(snap.data(),cc),raw=submissions[cc],submitted=raw?await adminVisibleSubmission(raw,cc):null,visible=!!submitted?.items;
        return{cc,department:visible?mergeSubmissionIntoBaseline(baseline,submitted):baseline,visible};
      }));
      loaded.filter(Boolean).forEach(x=>{deps[x.cc]=x.department;visibleFlags[x.cc]=x.visible});
      setStatus(`Loading Finance OPEX · ${Math.min(start+chunk.length,docs.length)} / ${docs.length} departments`);
      await new Promise(resolve=>setTimeout(resolve,0));
    }
    submissionCount=Object.values(visibleFlags).filter(Boolean).length;
  }

  if(!Object.keys(deps).length)throw new Error('No shared OPEX departments were found');
  const currentMaster=masterObject(meta.data()?.accountMaster),fullMaster=normalizeMaster(currentMaster,deps);
  if(Object.keys(currentMaster).length<Object.keys(fullMaster).length)await setDoc(doc(db,'opex_baseline_meta','current'),{accountMaster:masterArray(fullMaster),accountCount:Object.keys(fullMaster).length,schemaVersion:7,masterUpdatedAt:serverTimestamp()},{merge:true});
  const m={fileName:meta.data().fileName||'Cloud OPEX Baseline',departments:deps,accountMaster:fullMaster,cloud:true,cloudAdminView:true,submissionCount,baselineVersion:lastBaselineVersion,adminCacheCheckedAt:watchFrom,adminVisibleSubmissionFlags:visibleFlags};
  saveLocal(m);rebuildDropdown(m,profile);setStatus(`Latest Finance OPEX loaded · ${Object.keys(deps).length} departments · ${submissionCount} approved submission${submissionCount===1?'':'s'}`);return m;
}
loadAdminView=loadAdminViewChunked;'''

          s, n = re.subn(r"async function loadAdminViewChunked\(profile\)\{.*?\}\nloadAdminView=loadAdminViewChunked;", new_loader, s, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('Could not replace loadAdminViewChunked safely')

          new_apply = r'''async function applyAdminSubmissionChanges(profile){const changes=[...pendingAdminSubmissionChanges.values()];pendingAdminSubmissionChanges.clear();if(!changes.length)return;const m=localModel();if(!m?.departments){await loadAdminView(profile);return}const flags={...(m.adminVisibleSubmissionFlags||{})};for(let start=0;start<changes.length;start+=8){const chunk=changes.slice(start,start+8),updates=await Promise.all(chunk.map(async change=>{const cc=clean(change.doc.id);if(!cc)return null;const baselineSnap=await getDoc(doc(db,'opex_baseline_departments',cc));if(!baselineSnap.exists())return null;const baseline=await decode(baselineSnap.data(),cc),submitted=await adminVisibleSubmission(change.doc.data()||{},cc),visible=!!submitted?.items;return{cc,department:visible?mergeSubmissionIntoBaseline(baseline,submitted):baseline,visible}}));updates.filter(Boolean).forEach(x=>{m.departments[x.cc]=x.department;flags[x.cc]=x.visible});await new Promise(resolve=>setTimeout(resolve,0))}m.cloud=true;m.cloudAdminView=true;m.adminVisibleSubmissionFlags=flags;m.submissionCount=Object.values(flags).filter(Boolean).length;m.adminCacheCheckedAt=Date.now();saveLocal(m);document.getElementById('deptFilter')?.dispatchEvent(new Event('change',{bubbles:true}));setStatus(`${changes.length} workflow update${changes.length===1?'':'s'} applied · last Finance-approved values remain visible`)}
function watchAdminSubmissions(profile){if(adminSubmissionUnsub)return;const since=Timestamp.fromMillis(Math.max(0,(adminWatchSinceMs||Date.now())-5000)),qy=query(collection(db,'opex_budget_submissions'),where('workflowUpdatedAt','>=',since));adminSubmissionUnsub=onSnapshot(qy,snap=>{adminSubmissionWatchReady=true;snap.docChanges().filter(change=>change.type==='added'||change.type==='modified').forEach(change=>pendingAdminSubmissionChanges.set(change.doc.id,change));if(!pendingAdminSubmissionChanges.size)return;clearTimeout(adminSubmissionTimer);adminSubmissionTimer=setTimeout(()=>applyAdminSubmissionChanges(profile).catch(e=>setStatus(`Admin OPEX refresh failed: ${e.code||e.message}`,true)),250)},e=>setStatus(`Admin OPEX live updates failed: ${e.code||e.message}`,true))}'''

          s, n = re.subn(r"async function applyAdminSubmissionChanges\(profile\)\{.*?\}\nfunction watchAdminSubmissions\(profile\)\{.*?\}\n(?=function watchBaseline)", new_apply + "\n", s, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('Could not replace admin live-update block safely')

          if s == original:
            raise SystemExit('No OPEX optimization changes were applied')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- js/opex-sync-v2.js
      - name: Commit optimization and clean one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-opex-read-optimization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/opex-sync-v2.js .github/workflows/one-time-opex-read-optimization.yml
          git commit -m 'Optimize OPEX Firestore reads'
          git push
