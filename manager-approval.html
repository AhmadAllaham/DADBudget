<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Approval Center - DAD Budget 2027</title><link rel="stylesheet" href="css/style.css"><style>
.approval-page{padding-top:30px}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}.page-head h1{margin:3px 0 5px;font-size:30px;color:#123e63}.page-head p{margin:0;color:#667d82;font-size:12px;font-weight:700}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.mini{padding:14px}.mini span{font-size:9px;font-weight:1000;color:#71878b;text-transform:uppercase}.mini strong{display:block;margin-top:5px;font-size:24px;color:#153f46}.table-card{overflow:hidden}.table-wrap{overflow:auto;max-height:680px}.table{width:100%;border-collapse:separate;border-spacing:0;font-size:10px}.table th{position:sticky;top:0;background:#0a2c61;color:#fff;padding:10px;text-align:left}.table td{padding:10px;border-bottom:1px solid #e4eeee;background:#fff;vertical-align:middle}.table tr:hover td{background:#f1fbf9}.dept{font-weight:1000;color:#153f46}.muted{font-size:9px;color:#74898d}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:8px;font-weight:1000}.pending_manager{background:#fff7dc;color:#826400}.manager_approved{background:#eaf8f4;color:#087a64}.manager_returned{background:#fff0ee;color:#b23b3b}.note{height:34px;min-width:190px;border:1px solid #d1e3e0;border-radius:7px;padding:0 8px}.approve,.return{height:34px;border:0;border-radius:7px;padding:0 11px;font-size:9px;font-weight:1000;cursor:pointer}.approve{background:linear-gradient(90deg,#0e8f86,#13a79b);color:#fff}.return{background:#fff0ee;color:#a63b3b;border:1px solid #efc8c2;margin-left:5px}.empty{text-align:center!important;padding:30px!important;color:#71878b!important}@media(max-width:900px){.kpis{grid-template-columns:1fr}.page-head{flex-direction:column}}
</style></head><body><div class="app-shell"><aside class="sidebar"><div class="sidebar-brand"><div class="brand-badge">B27</div><div><strong>BUDGET 2027</strong><span>PLANNING CENTER</span></div></div><nav class="sidebar-nav"><a href="index.html">Dashboard</a><a href="roadmap.html">Roadmap</a><a href="opex.html">OPEX Planning</a><a class="active" href="manager-approval.html">Approval Center</a></nav></aside><main class="main-content approval-page"><div class="page-head"><div><span class="eyebrow">MANAGER APPROVAL</span><h1>Budget Approval Center</h1><p>Approve or return department budgets before Finance review.</p></div><button class="dark-btn" id="logoutBtn">Log out</button></div><section class="kpis"><article class="card mini"><span>Pending Approval</span><strong id="kPending">0</strong></article><article class="card mini"><span>Approved</span><strong id="kApproved">0</strong></article><article class="card mini"><span>Returned</span><strong id="kReturned">0</strong></article></section><section class="card table-card"><div class="table-wrap"><table class="table"><thead><tr><th>Department</th><th>Submitted By</th><th>Workbook</th><th>Revision</th><th>Status</th><th>Manager Note</th><th>Action</th></tr></thead><tbody id="body"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody></table></div></section></main></div><script src="js/app.js?v=20260817-manager-approval-1"></script><script type="module" src="js/firebase.js?v=20260817-manager-approval-1"></script><script type="module">
import { getApps } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';import { getAuth,onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';import { getFirestore,collection,getDocs,doc,getDoc,setDoc,serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
const app=getApps()[0],auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let profile=null,rows=[];const clean=v=>String(v??'').trim();
async function load(){const assigned=(profile?.departments||[]).map(String).filter(x=>x&&x!=='ALL'),admin=profile?.role==='admin'||profile?.isMainAdmin===true;const [ss,us]=await Promise.all([getDocs(collection(db,'budget_submission_status')),getDocs(collection(db,'opex_budget_submissions'))]);const uploads={};us.forEach(x=>uploads[x.id]=x.data());rows=ss.docs.map(x=>({cc:x.id,...x.data(),upload:uploads[x.id]})).filter(r=>admin||assigned.includes(String(r.cc))).filter(r=>['pending_manager','manager_approved','manager_returned'].includes(r.status||r.workflowStatus));render()}
function render(){ $('kPending').textContent=rows.filter(r=>(r.status||r.workflowStatus)==='pending_manager').length;$('kApproved').textContent=rows.filter(r=>(r.status||r.workflowStatus)==='manager_approved').length;$('kReturned').textContent=rows.filter(r=>(r.status||r.workflowStatus)==='manager_returned').length;if(!rows.length){$('body').innerHTML='<tr><td colspan="7" class="empty">No department budgets waiting for your approval.</td></tr>';return}$('body').innerHTML=rows.map(r=>{const st=r.status||r.workflowStatus;return `<tr data-cc="${r.cc}"><td><span class="dept">${r.departmentName||r.upload?.name||r.cc}</span><div class="muted">${r.cc}</div></td><td>${r.submittedByEmail||r.upload?.submittedEmail||'—'}</td><td>${r.upload?.fileName||'—'}</td><td>${r.upload?.revision?'R'+r.upload.revision:'—'}</td><td><span class="badge ${st}">${st==='pending_manager'?'Pending Manager Approval':st==='manager_approved'?'Manager Approved':'Returned by Manager'}</span></td><td><input class="note" data-note value="${String(r.managerNote||'').replace(/"/g,'&quot;')}" placeholder="Optional note"></td><td>${st==='pending_manager'?'<button class="approve" data-action="approve">Approve</button><button class="return" data-action="return">Return</button>':'<span class="muted">Decision saved</span>'}</td></tr>`}).join('');document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>decide(b.closest('tr'),b.dataset.action,b))}
async function decide(tr,action,btn){const cc=tr.dataset.cc,r=rows.find(x=>x.cc===cc),note=tr.querySelector('[data-note]').value.trim(),user=auth.currentUser;try{btn.disabled=true;const approved=action==='approve';await setDoc(doc(db,'budget_submission_status',cc),{status:approved?'manager_approved':'manager_returned',workflowStatus:approved?'manager_approved':'manager_returned',managerStatus:approved?'approved':'returned',managerNote:note,managerApprovedAt:approved?serverTimestamp():null,managerApprovedBy:approved?user.uid:null,managerApprovedByEmail:approved?clean(user.email).toLowerCase():null,managerDecisionAt:serverTimestamp(),managerDecisionBy:user.uid,managerDecisionEmail:clean(user.email).toLowerCase(),updatedAt:serverTimestamp()},{merge:true});await load()}catch(e){alert('Approval failed: '+e.message)}finally{btn.disabled=false}}
onAuthStateChanged(auth,async user=>{if(!user)return;const ps=await getDoc(doc(db,'users',user.uid));profile=ps.exists()?ps.data():{};if(!['manager','admin'].includes(profile.role)&&profile.isMainAdmin!==true){location.replace('index.html');return}load()});
</script></body></html>
