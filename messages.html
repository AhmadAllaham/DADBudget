<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Messages - DAD Budget 2027</title>
<link rel="stylesheet" href="css/style.css">
<style>
.msg-page{padding-top:26px}.msg-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}.msg-head h1{margin:3px 0 4px;font-size:30px;color:#123e63}.msg-head p{margin:0;color:#667d82;font-size:11px;font-weight:750}.msg-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:12px}.msg-left,.msg-main{min-height:650px}.msg-toolbar{display:flex;gap:6px;padding:10px;border-bottom:1px solid #dfecea}.tab{border:1px solid #cfe1de;background:#fff;color:#526d73;border-radius:8px;padding:8px 10px;font-size:9px;font-weight:1000;cursor:pointer}.tab.active{background:#0f9c92;color:#fff;border-color:#0f9c92;box-shadow:0 0 12px rgba(24,222,200,.14)}.new-btn{margin-left:auto;border:0;background:linear-gradient(90deg,#0e8f86,#13a79b);color:#fff;border-radius:8px;padding:8px 11px;font-size:9px;font-weight:1000;cursor:pointer}.msg-search{padding:9px 10px;border-bottom:1px solid #edf3f2}.msg-search input{width:100%;height:34px;border:1px solid #d2e4e1;border-radius:8px;padding:0 9px;font-size:10px;font-weight:750}.msg-list{max-height:570px;overflow:auto}.msg-item{padding:11px 12px;border-bottom:1px solid #edf3f2;cursor:pointer;background:#fff}.msg-item:hover{background:#f5fbfa}.msg-item.unread{background:#eefaf8;border-left:3px solid #12a397}.msg-item .top{display:flex;justify-content:space-between;gap:8px}.msg-item b{font-size:10px;color:#123e63}.msg-item time{font-size:8px;color:#839497;white-space:nowrap}.msg-item .sub{font-size:9px;font-weight:900;color:#35575d;margin-top:4px}.msg-item .preview{font-size:8px;color:#768b8f;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:28px 14px;text-align:center;color:#7c9094;font-size:10px;font-weight:800}.conversation{height:100%;display:flex;flex-direction:column}.conversation-empty{margin:auto;text-align:center;color:#819296}.conversation-empty strong{display:block;color:#31565e;font-size:17px;margin-bottom:5px}.thread-head{padding:16px;border-bottom:1px solid #dfecea}.thread-head h2{font-size:18px;color:#123e63;margin:2px 0 4px}.thread-head div{font-size:9px;color:#71878b;font-weight:800}.thread-body{padding:14px;overflow:auto;flex:1;max-height:470px;background:#f8fbfb}.bubble{max-width:72%;padding:10px 12px;border-radius:12px;margin-bottom:9px;font-size:10px;line-height:1.5;white-space:pre-wrap}.bubble.mine{margin-left:auto;background:#dff7f2;color:#164d49;border-bottom-right-radius:3px}.bubble.theirs{background:#fff;color:#28474d;border:1px solid #deebe9;border-bottom-left-radius:3px}.bubble small{display:block;margin-top:5px;font-size:7.5px;color:#7b9094}.reply-box{padding:11px;border-top:1px solid #dfecea;display:flex;gap:8px}.reply-box textarea{flex:1;min-height:62px;resize:vertical;border:1px solid #cee1de;border-radius:9px;padding:9px;font:inherit;font-size:10px}.send-btn{align-self:stretch;min-width:90px;border:0;border-radius:9px;background:#0f9c92;color:#fff;font-size:10px;font-weight:1000;cursor:pointer}.compose{display:none;padding:16px}.compose.show{display:block}.compose-grid{display:grid;gap:9px}.compose label{font-size:9px;font-weight:1000;color:#47666c}.compose input,.compose textarea{width:100%;border:1px solid #cfe1de;border-radius:9px;padding:9px;font:inherit;font-size:10px}.compose input{height:38px}.compose textarea{min-height:160px;resize:vertical}.compose-actions{display:flex;justify-content:flex-end;gap:7px}.cancel-btn{border:1px solid #cfe1de;background:#fff;border-radius:8px;padding:9px 13px;font-size:9px;font-weight:1000}.status{padding:8px 12px;font-size:9px;color:#70868b}.status.err{color:#b13e3e}.status.ok{color:#087a64}@media(max-width:900px){.msg-layout{grid-template-columns:1fr}.msg-left,.msg-main{min-height:auto}.msg-list{max-height:350px}}
</style>
</head>
<body><div class="app-shell">
<aside class="sidebar"><div class="sidebar-brand"><div class="brand-badge">B27</div><div><strong>BUDGET 2027</strong><span>PLANNING CENTER</span></div></div><nav class="sidebar-nav"><a href="index.html">Dashboard</a><a href="roadmap.html">Roadmap</a><a href="opex.html">OPEX Planning</a><a class="active" href="messages.html">Messages</a></nav></aside>
<main class="main-content msg-page">
<div class="msg-head"><div><span class="eyebrow">INTERNAL COMMUNICATION</span><h1>Messages</h1><p>Budget discussions, manager feedback and Finance communication in one place.</p></div><button class="dark-btn" id="logoutBtn">Log out</button></div>
<div class="msg-layout">
<section class="card msg-left"><div class="msg-toolbar"><button class="tab active" data-tab="inbox">Inbox <span id="inboxCount"></span></button><button class="tab" data-tab="sent">Sent</button><button class="new-btn" id="newBtn">+ New</button></div><div class="msg-search"><input id="search" placeholder="Search messages..."></div><div class="status" id="statusLine">Loading messages...</div><div class="msg-list" id="messageList"></div></section>
<section class="card msg-main"><div class="conversation" id="conversation"><div class="conversation-empty"><strong>Select a message</strong><span>Open a conversation or create a new message.</span></div></div><div class="compose" id="compose"><div class="compose-grid"><label>TO<input id="toEmail" type="email" placeholder="user@dadgroup.com" list="userEmails"></label><datalist id="userEmails"></datalist><label>SUBJECT<input id="subject" placeholder="Budget 2027"></label><label>MESSAGE<textarea id="bodyText" placeholder="Write your message..."></textarea></label><div class="compose-actions"><button class="cancel-btn" id="cancelCompose">Cancel</button><button class="send-btn" id="sendNew">Send</button></div></div></div></section>
</div></main></div>
<script src="js/app.js?v=20260820-hr-section-2"></script>
<script type="module" src="js/firebase.js?v=20260817-budget-notifications-1"></script>
<script type="module">
import {getApps} from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocs,query,where,setDoc,updateDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
const app=getApps()[0],auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let me='',uid='',mode='inbox',messages=[],selected=null;
const clean=v=>String(v??'').trim(),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dateOf=m=>m.createdAt?.toDate?m.createdAt.toDate():new Date(m.clientCreatedAt||0);const fmt=m=>{const d=dateOf(m);return isNaN(d)?'':d.toLocaleString()};
function setStatus(t,c=''){ $('statusLine').textContent=t;$('statusLine').className='status '+c}
async function loadUsers(){try{const s=await getDocs(collection(db,'users'));$('userEmails').innerHTML=s.docs.map(x=>x.data()?.email).filter(Boolean).map(e=>`<option value="${esc(e)}"></option>`).join('')}catch(_){}}
async function load(){try{setStatus('Loading messages...');const qy=query(collection(db,'messages'),where(mode==='inbox'?'toEmail':'fromEmail','==',me));const s=await getDocs(qy);messages=s.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.kind!=='notification').sort((a,b)=>dateOf(b)-dateOf(a));renderList();const unread=messages.filter(x=>mode==='inbox'&&x.read!==true).length;$('inboxCount').textContent=mode==='inbox'&&unread?`(${unread})`:'';setStatus(`${messages.length} message${messages.length===1?'':'s'}`,'ok')}catch(e){console.error(e);setStatus(`Messages unavailable: ${e.code||e.message}`,'err');$('messageList').innerHTML='<div class="empty">Firestore permission for messages is not enabled yet.</div>'}}
function renderList(){const q=clean($('search').value).toLowerCase(),list=messages.filter(m=>!q||[m.subject,m.body,m.fromEmail,m.toEmail].join(' ').toLowerCase().includes(q));if(!list.length){$('messageList').innerHTML='<div class="empty">No messages found.</div>';return}$('messageList').innerHTML=list.map(m=>`<div class="msg-item ${mode==='inbox'&&m.read!==true?'unread':''}" data-id="${m.id}"><div class="top"><b>${esc(mode==='inbox'?m.fromEmail:m.toEmail)}</b><time>${esc(fmt(m))}</time></div><div class="sub">${esc(m.subject||'(No subject)')}</div><div class="preview">${esc(m.body||'')}</div></div>`).join('');document.querySelectorAll('.msg-item').forEach(x=>x.onclick=()=>openMessage(x.dataset.id))}
async function threadMessages(root){const participants=[root.fromEmail,root.toEmail];const qy=query(collection(db,'messages'),where('threadId','==',root.threadId||root.id));try{const s=await getDocs(qy);return s.docs.map(x=>({id:x.id,...x.data()})).filter(x=>participants.includes(x.fromEmail)&&participants.includes(x.toEmail)).sort((a,b)=>dateOf(a)-dateOf(b))}catch(_){return[root]}}
async function openMessage(id){selected=messages.find(x=>x.id===id);if(!selected)return;if(mode==='inbox'&&selected.read!==true){try{await updateDoc(doc(db,'messages',id),{read:true,readAt:serverTimestamp()});selected.read=true;renderList()}catch(_){}}const thread=await threadMessages(selected);const other=selected.fromEmail===me?selected.toEmail:selected.fromEmail;$('compose').classList.remove('show');$('conversation').style.display='flex';$('conversation').innerHTML=`<div class="thread-head"><div>CONVERSATION WITH ${esc(other)}</div><h2>${esc(selected.subject||'(No subject)')}</h2><div>${thread.length} message${thread.length===1?'':'s'}</div></div><div class="thread-body">${thread.map(m=>`<div class="bubble ${m.fromEmail===me?'mine':'theirs'}">${esc(m.body)}<small>${esc(m.fromEmail)} · ${esc(fmt(m))}</small></div>`).join('')}</div><div class="reply-box"><textarea id="replyText" placeholder="Reply..."></textarea><button class="send-btn" id="sendReply">Reply</button></div>`;$('sendReply').onclick=()=>sendReply(other,selected.threadId||selected.id,selected.subject)}
async function sendMessage(to,subject,body,threadId=''){to=clean(to).toLowerCase();subject=clean(subject);body=clean(body);if(!to||!to.includes('@'))throw new Error('Enter a valid recipient email.');if(!body)throw new Error('Message is required.');const ref=doc(collection(db,'messages')),root=threadId||ref.id;await setDoc(ref,{fromUid:uid,fromEmail:me,toEmail:to,subject:subject||'Budget 2027',body,threadId:root,participants:[me,to].sort(),read:false,createdAt:serverTimestamp(),clientCreatedAt:new Date().toISOString()});return ref.id}
async function sendReply(to,threadId,subject){const t=$('replyText'),b=clean(t.value);if(!b)return;try{$('sendReply').disabled=true;await sendMessage(to,subject,b,threadId);t.value='';await load();selected={...selected,threadId};await openMessage(selected.id)}catch(e){alert('Message failed: '+(e.code||e.message))}finally{if($('sendReply'))$('sendReply').disabled=false}}
$('newBtn').onclick=()=>{$('conversation').style.display='none';$('compose').classList.add('show');$('toEmail').focus()};$('cancelCompose').onclick=()=>{$('compose').classList.remove('show');$('conversation').style.display='flex'};$('sendNew').onclick=async()=>{try{$('sendNew').disabled=true;await sendMessage($('toEmail').value,$('subject').value,$('bodyText').value);$('toEmail').value='';$('subject').value='';$('bodyText').value='';$('compose').classList.remove('show');$('conversation').style.display='flex';mode='sent';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===mode));await load()}catch(e){alert('Message failed: '+(e.code||e.message))}finally{$('sendNew').disabled=false}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));selected=null;$('conversation').innerHTML='<div class="conversation-empty"><strong>Select a message</strong><span>Open a conversation or create a new message.</span></div>';load()});$('search').oninput=renderList;
onAuthStateChanged(auth,async user=>{if(!user)return;uid=user.uid;me=clean(user.email).toLowerCase();await Promise.all([load(),loadUsers()])});
</script></body></html>
